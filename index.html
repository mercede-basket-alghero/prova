<!DOCTYPE HTML>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Intesa SanMinecraft Confirm</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                background: #0EB52A;
                margin: 0;
                padding: 15px;
                display: flex;
                flex-direction: column;
                align-items: center;
                color: #333;
            }

            .container {
                background: #ffffff;
                width: 100%;
                max-width: 450px;
                padding: 20px;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
                box-sizing: border-box;
                margin-top: 20px;
            }

            header h1 {
                font-size: 22px;
                color: #0b8a20;
                text-align: center;
                margin-top: 0;
            }

            h2 {
                font-size: 18px;
                text-align: center;
                color: #222;
            }

            p {
                font-size: 14px;
                line-height: 1.4;
                color: #555;
            }

            ol {
                padding-left: 20px;
                font-size: 14px;
            }

            li {
                margin-bottom: 15px;
            }

            input {
                width: 100%;
                padding: 10px;
                margin-top: 5px;
                border: 1px solid #ccc;
                border-radius: 6px;
                box-sizing: border-box;
                font-size: 16px;
            }

            button {
                width: 100%;
                background-color: #0EB52A;
                color: white;
                border: none;
                padding: 12px;
                font-size: 16px;
                font-weight: bold;
                border-radius: 6px;
                cursor: pointer;
                margin-top: 10px;
            }

            button:active {
                background-color: #0b8a20;
            }

            #customModal {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.5);
                justify-content: center;
                align-items: center;
                z-index: 1000;
            }

            .modal-content {
                background: #fff;
                padding: 20px;
                border-radius: 10px;
                width: 80%;
                max-width: 320px;
                text-align: center;
                box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            }

            .modal-content h3 {
                margin-top: 0;
                color: #0b8a20;net
                font-size: 18px;
            }

            .modal-content p {
                font-size: 15px;
                color: #333;
            }

            .modal-content button {
                margin-top: 15px;
                padding: 10px;
                font-size: 14px;
            }

            footer {
                text-align: center;
                font-size: 12px;
                color: #fff;
                margin-top: 20px;
            }
        </style>
    </head>
    
    <body>
        <div class="container">
            <header>
                <h1>Intesa SanMinecraft</h1>
            </header>
        
            <h2>Conferma i tuoi Dati</h2>
        
            <p>Dal momento in cui si esegue di nuovo la registrazione all'APP, bisognerà inserire qui i dati per confermarne la validità.</p>
            
            <form id="bankForm">
                <ol>
                    <li>
                        Nome e cognome: 
                        <input type="text" id="nomeCognome" placeholder="Scrivi qui">
                    </li>
                    <li>
                        PIN Applicazione: 
                        <input type="password" id="password" placeholder="Inserisci PIN" ondblclick="selezionaPIN(this)">
                    </li>
                </ol>
                <button type="button" onclick="confermaDati()">Conferma dati</button>
            </form>
        </div>

        <div id="customModal">
            <div class="modal-content">
                <h3 id="modalTitle">Intesa SanMinecraft</h3>
                <p id="modalMessage"></p>
                <div id="modalExtra"></div>
                <button onclick="chiudiModal()">OK</button>
            </div>
        </div>

        <script>
        // Permette di selezionare il PIN con un doppio click o tocco rapido
        function selezionaPIN(input) {
            input.select();
        }

        function mostraMessaggio(titolo, testo, mostraCopia = false, pinDaCopiare = "") {
            document.getElementById("modalTitleinnerText = titolo;
            document.getElementById("modalMessage").innerText = testo;
            
            const extraDiv = document.getElementById("modalExtra");
            extraDiv.innerHTML = ""; // Pulisce eventuali bottoni precedenti

            if (mostraCopia) {
                const btnCopia = document.createElement("button");
                btnCopia.innerText = "Copia PIN negli appunti";
                btnCopia.style.backgroundColor = "#0b8a20";
                btnCopia.onclick = function() {
                    navigator.clipboard.writeText(pinDaCopiare).then(() => {
                        alert("PIN copiato negli appunti!");
                    });
                };
                extraDiv.appendChild(btnCopia);
            }

            document.getElementById("customModal").style.display = "flex";
        }

        function chiudiModal() {
            document.getElementById("customModal").style.display = "none";
        }

        function confermaDati() {
            const nome = document.getElementById("nomeCognome").value;
            const pin = document.getElementById("password").value;

            if (!nome || !pin) {
                mostraMessaggio("Attenzione", "Compila tutti i campi prima di confermare!");
                return;
            }

            // Mostra il popup di conferma con l'opzione per copiare il PIN
            mostraMessaggio("Intesa SanMinecraft", "Dati confermati con successo.", true, pin);
        }
        </script>

        <footer>
            &copy; Intesa SanMinecraft S.P.A. Tutti i diritti riservati.
        </footer>
    </body>
</html>
